<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كامب ساس · CAMP SAS</title>
<meta name="description" content="CAMP SAS — كامب ساس: إدارة سكن المخيم والغرف والبلاغات">
<meta name="theme-color" content="#F5F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كامب ساس">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<style>
@font-face{font-family:"Almarai";font-weight:400;font-display:swap;src:url("fonts/almarai-arabic-400-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Almarai";font-weight:700;font-display:swap;src:url("fonts/almarai-arabic-700-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Almarai";font-weight:800;font-display:swap;src:url("fonts/almarai-arabic-800-normal.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Almarai";font-weight:400;font-display:swap;src:url("fonts/almarai-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Almarai";font-weight:700;font-display:swap;src:url("fonts/almarai-latin-700-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"Almarai";font-weight:800;font-display:swap;src:url("fonts/almarai-latin-800-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}

/* CAMP SAS v1.0 — واجهة «المهام»: أزرار كبيرة حسب العمل المطلوب */
:root{--bg:#F5F3F0;--card:#FFFFFF;--ink:#1F2937;--muted:#5B5B5B;--line:#E6E1DA;--soft:#EFEBE6;--pri:#1F2937;--priInk:#FFFFFF;--brand:#C8312D;--green:#3B7E48;--empty:#ECE8E1;--emptyInk:#44403C;--emptyLine:#A8A29E;--warnBg:#FDF3E3;--warnInk:#7C4A03;--okBg:#E7F3EA;--okInk:#1E5B2C;--badBg:#FDECEC;--badInk:#B91C1C;--shadow:0 4px 16px rgba(31,41,55,.07)}
[data-theme=dark]{--bg:#111418;--card:#1B2027;--ink:#ECEFF3;--muted:#A3ADB8;--line:#2B323B;--soft:#232931;--pri:#ECEFF3;--priInk:#111418;--empty:#262C34;--emptyInk:#C9D1DA;--emptyLine:#4A5360;--warnBg:#33240D;--warnInk:#FCD9A8;--okBg:#14301C;--okInk:#9BE3AE;--badBg:#3A1414;--badInk:#FCA5A5;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Almarai',system-ui,sans-serif;font-weight:400;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:'Almarai',system-ui,sans-serif;color:inherit}
button{cursor:pointer}
b,strong{font-weight:700}
.wrap{max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0}
.logo img{width:62px;display:block}
.logo .strip{display:flex;align-items:center;gap:2px}
.logo .g{width:6px;height:9px;background:#3B7E48;transform:skewX(-20deg)}
.logo .c{height:11px;padding:0 5px;background:#D33834;color:#fff;font:800 8px 'Almarai';letter-spacing:.5px;display:flex;align-items:center;transform:skewX(-12deg)}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.brand b{font-weight:800;font-size:20px}
.brand span{font-size:12px;color:var(--muted)}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;color:var(--ink);font-weight:700;font-size:14px}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:20px;height:20px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar h1{margin:0;flex:1;font-weight:800;font-size:23px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:52px;margin-bottom:12px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:16px;min-width:0}
.search svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.sum span{font-size:12px;color:var(--muted)}
.sum b{font-weight:800;font-size:22px}
.banner{display:flex;align-items:center;gap:10px;background:var(--badBg);color:var(--badInk);border:0;border-radius:14px;padding:12px 14px;width:100%;margin-bottom:12px;font-weight:700;font-size:14px;text-align:start}
.banner svg{width:20px;height:20px;flex-shrink:0}
/* shared unit page */
.hero{border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);margin-bottom:12px;box-shadow:var(--shadow)}
.hero .num{font-weight:800;font-size:38px;line-height:1}
.hero .sub{font-size:13px;color:var(--muted)}
.pill{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.shift{background:var(--card);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);scroll-margin-top:12px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tag{min-width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;padding:0 8px}
.shead b{flex:1;font-size:16px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.slot{background:var(--soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.slot .bed{font-size:12px;color:var(--muted)}
.slot .nm{font-weight:700;font-size:16px}
.slot .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.slot .meta b{color:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px}
.acts a,.acts button{height:42px;border-radius:10px;border:0;background:var(--card);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.acts .bad{color:var(--badInk)}
.slot.add{border:2px dashed var(--emptyLine);background:transparent;color:var(--ink);font-weight:700;align-items:center;justify-content:center;min-height:110px;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-weight:800;font-size:16px}
.rep{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.rep:first-of-type{border-top:0}
.rep .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rep .tx span{font-size:12px;color:var(--muted)}
.rep .un{font-weight:800;font-size:14px;background:var(--soft);border:0;border-radius:10px;padding:8px 10px;flex-shrink:0}
.btn{min-height:48px;border-radius:14px;border:0;background:var(--pri);color:var(--priInk);font-weight:700;font-size:15px;padding:0 18px}
.btn.sm{min-height:40px;font-size:13px;padding:0 12px;border-radius:12px}
.btn.ok{background:#15803D;color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--badBg);color:var(--badInk)}
.btn.block{width:100%}
textarea,.inp,select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px;outline:0}
.inp,select{height:50px}
textarea{resize:vertical;min-height:70px}
textarea:focus,.inp:focus,select:focus{border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.warn{background:var(--warnBg);color:var(--warnInk);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.log{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.log:first-child{border-top:0}
.log .d{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.log .tm{color:var(--muted);font-size:12px;flex-shrink:0}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.pick button.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.fmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fmts button{height:74px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fmts button b{font-weight:800;font-size:17px}
.fmts button span{font-size:11px;color:var(--muted)}
.fmts button.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.fmts button.on span{color:var(--priInk)}
.shrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.shrow .n{font-size:13px;color:var(--muted);width:64px;flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 14px;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);transform:translateX(-50%);background:var(--pri);color:var(--priInk);padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty-msg{text-align:center;color:var(--muted);padding:30px 10px}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:16px;padding:12px;text-align:start;width:100%;box-shadow:var(--shadow)}
.res .box{width:64px;height:54px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.res .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.res .info b{font-weight:700}
.res .info span{font-size:13px;color:var(--muted)}
nav.bn{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bn .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:640px}
nav.bn button{border:0;background:transparent;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);position:relative}
nav.bn button.on{color:var(--ink);font-weight:800}
nav.bn svg{width:22px;height:22px}
nav.bn .badge{top:8px;inset-inline-end:calc(50% - 26px)}
.fab{position:fixed;inset-inline-start:max(16px,calc(50% - 484px));bottom:calc(env(safe-area-inset-bottom) + 86px);height:56px;padding:0 20px;border-radius:18px;border:0;background:var(--pri);color:var(--priInk);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(0,0,0,.25);z-index:5}
.fab svg{width:22px;height:22px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:14px 2px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-inline-end:4px}
/* الشاشة الرئيسية: أزرار المهام */
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mtile{border:0;background:var(--card);border-radius:22px;padding:18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:start;position:relative;box-shadow:var(--shadow)}
.mtile .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.mtile .ic svg{width:26px;height:26px}
.mtile b{font-weight:800;font-size:17px;color:var(--ink)}
.mtile span{font-size:12px;color:var(--muted)}
.mtile .badge{color:#fff;font-size:12px;min-width:24px;height:24px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.group{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ghead{display:flex;align-items:center;gap:8px}
.ghead b{font-weight:800;font-size:17px;flex:1}
.ghead span{font-size:13px;color:var(--muted)}
.gadd{width:34px;height:34px;border-radius:10px;border:1px dashed var(--emptyLine);background:transparent;color:var(--muted);font-size:18px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:0;background:var(--soft);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative;text-align:center}
.tno{font-weight:800;font-size:16px;padding:2px 0}
.half{border-radius:9px;height:28px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700}
.half.e{background:var(--empty);color:var(--emptyInk);border:1.5px dashed var(--emptyLine)}
.half.m{background:#78716C;color:#fff}
.rdot{position:absolute;top:-6px;inset-inline-start:-6px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.mtile.wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.mtile.wide .txt{display:flex;flex-direction:column;gap:4px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:6px;border-radius:999px;background:var(--line)}
.steps span.on{background:var(--pri)}
.qtitle{font-weight:800;font-size:20px;margin:0 0 4px}
.qsub{font-size:13px;color:var(--muted);margin:0 0 14px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:16px;min-height:96px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:start}
.choice b{font-weight:800;font-size:22px}
.choice span{font-size:13px;color:var(--muted)}
.choice:disabled{opacity:.45}
.choice .fr{font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px}
/* قوائم الغرف */
.ilist{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.irow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 14px;min-height:66px;text-align:start;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .lead{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.irow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.irow .mid b{font-weight:700;font-size:16px}
.irow .mid span{font-size:12px;color:var(--muted)}
.irow .chev{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.irow .rp{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:3px 8px;flex-shrink:0}
.mbar{display:flex;gap:3px;height:8px;max-width:180px}
.mbar i{flex:1;border-radius:3px;background:var(--empty)}
.shp{display:flex;flex-wrap:wrap;gap:4px}
.shp span{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.sechead{font-size:13px;color:var(--muted);margin:4px 6px 8px;font-weight:700}
#render{position:fixed;top:0;left:-10000px;width:900px;background:#fff;color:#1F2937;font-family:'Almarai',sans-serif}
@media(max-width:420px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="nav"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="render" aria-hidden="true"></div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) && location.protocol==='https:'){
  try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
}
</script>
</body>
</html>
